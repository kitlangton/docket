name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Typecheck and key table
        run: bun run typecheck

      # npm publish silently rewrites invalid package.json fields; keep the manifest canonical.
      - name: package.json is canonical
        run: npm pkg fix && git diff --exit-code package.json

      - name: Unit tests
        run: bun run test

      - id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: End-to-end tests
        run: bun run e2e
